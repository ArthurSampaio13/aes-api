default_language_version:
  # Pinned to an exact minor version (python3.11) used to fail here with
  # "failed to find interpreter" on machines that don't have that exact
  # binary on PATH (this repo's own venv runs 3.13). `python3` lets each
  # hook's virtualenv bootstrap off whatever interpreter is actually present.
  python: python3

# Hooks below have no `stages:` of their own, so without this they'd run at
# every installed hook type — including pre-push, where a formatter rewriting
# a file blocks the push. Formatting/linting belongs at commit time only; the
# local hooks at the bottom of this file opt into pre-push/commit-msg explicitly.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: check-added-large-files
        exclude: ^(.*\/dummy.*|.*\.json)$
        args: ["--maxkb=750", "--enforce-all"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        name: Upgrade code to Python 3.10+

  - repo: https://github.com/myint/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        args: [--in-place, --wrap-summaries=115, --wrap-descriptions=120]

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        name: Unused noqa

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.16.0
    hooks:
      - id: blacken-docs
        args: [--line-length=120]
        additional_dependencies: [black==22.1.0]

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter
        exclude: CHANGELOG.md

  - repo: local
    hooks:
    - id: strip_ai_trailers
      name: Strip AI co-author trailers (this repo uses plain commit messages)
      language: system
      entry: python3 scripts/strip-ai-trailers.py
      pass_filenames: true
      stages: [commit-msg]
    - id: unit_test
      name: Unit test (backend)
      language: system
      entry: bash -c 'cd backend && uv run pytest'
      pass_filenames: false
      always_run: true
      types: [python]
      stages: [pre-push]
    - id: mypy_backend
      name: mypy (backend)
      language: system
      entry: bash -c 'cd backend && uv run mypy src'
      pass_filenames: false
      always_run: true
      types: [python]
      stages: [pre-push]
    - id: deptry_backend
      name: deptry — unused/missing dependencies (backend)
      language: system
      entry: bash -c 'cd backend && uv run deptry src'
      pass_filenames: false
      always_run: true
      types: [python]
      stages: [pre-push]
