apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aes-api.name" . }}-worker
  labels:
    {{- include "aes-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ include "aes-api.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "aes-api.name" . }}-worker
        {{- include "aes-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aes-api.name" . }}
      volumes:
        # O kubelet renova este token; o boto3 o troca por credenciais
        # temporarias via AssumeRoleWithWebIdentity. A audiencia precisa bater
        # com o client_id_list do provider OIDC no IAM.
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: worker
          image: {{ include "aes-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["taskiq", "worker", "src.infrastructure.taskiq.worker:default_broker", "src.modules.aes.worker", "--workers", {{ .Values.worker.concurrency | quote }}]
          workingDir: /app
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          env:
            - name: CODE_VERSION
              value: {{ .Values.codeVersion | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
            - name: TASKIQ_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/secrets/aws
              readOnly: true
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
