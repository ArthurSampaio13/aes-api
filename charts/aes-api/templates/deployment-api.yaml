apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aes-api.name" . }}-api
  labels:
    {{- include "aes-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "aes-api.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "aes-api.name" . }}-api
        {{- include "aes-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aes-api.name" . }}
      volumes:
        # O kubelet renova este token; o boto3 o troca por credenciais
        # temporarias via AssumeRoleWithWebIdentity. A audiencia precisa bater
        # com o client_id_list do provider OIDC no IAM.
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: api
          image: {{ include "aes-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: CODE_VERSION
              value: {{ .Values.codeVersion | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/secrets/aws
              readOnly: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
