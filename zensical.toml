[project]
site_name = "Correção assistida de redações"
site_description = "Artefato de software de um TCC sobre correção de redações do Ensino Fundamental assistida por modelos de linguagem."
site_url = "https://arthursampaio13.github.io/aes-api"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Arthur Sampaio"

extra_css = ["stylesheets/extra.css"]

# ==============================================================================
# Theme
# ==============================================================================

[project.theme]
variant = "modern"

logo = "assets/FastAPI-boilerplate.png"
favicon = "assets/FastAPI-boilerplate.png"

font.text = "Ubuntu"
font.code = "JetBrains Mono"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

# Light/dark palette — uses brand colors via stylesheets/extra.css
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ==============================================================================
# Footer / extra
# ==============================================================================

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ArthurSampaio13/aes-api"
name = "Repositório do projeto no GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/fastapi/"
name = "FastAPI on PyPI"

# ==============================================================================
# Navigation
# ==============================================================================

[[project.nav]]
"Home" = "index.md"

[[project.nav]]
"Projeto" = [
    { "Visão geral" = "projeto/index.md" },
    { "Arquitetura" = "projeto/arquitetura.md" },
    { "Processo de correção" = "projeto/processo-de-correcao.md" },
    { "Guardrails" = "projeto/guardrails.md" },
    { "OpenRouter" = "projeto/openrouter.md" },
    { "Rastreabilidade" = "projeto/rastreabilidade.md" },
    { "Decisões de projeto" = "projeto/decisoes.md" },
]

[[project.nav]]
"Operação" = [
    { "Rodando o AES" = "getting-started/running-aes.md" },
    { "Problemas conhecidos" = "known-issues.md" },
]

[[project.nav]]
"Referência da plataforma" = [
    { "Visão geral" = "user-guide/index.md" },
]

# ==============================================================================
# Markdown extensions
# ==============================================================================

[[project.markdown_extensions]]
admonition = {}

[[project.markdown_extensions]]
"pymdownx.details" = {}

[[project.markdown_extensions]]
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }

[[project.markdown_extensions]]
"pymdownx.inlinehilite" = {}

[[project.markdown_extensions]]
"pymdownx.snippets" = {}

[[project.markdown_extensions]]
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }

[[project.markdown_extensions]]
"pymdownx.tabbed" = { alternate_style = true }

[[project.markdown_extensions]]
"pymdownx.tasklist" = { custom_checkbox = true }

[[project.markdown_extensions]]
"toc" = { permalink = true }

[[project.markdown_extensions]]
"attr_list" = {}

[[project.markdown_extensions]]
"md_in_html" = {}
